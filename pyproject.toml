[project]
name = "filing-corpus-pipeline"
version = "0.1.0"
description = "Service and infrastructure for filing ingestion and processing."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "lxml>=6.0.0,<7",
]



[project.scripts]
"filing-corpus-pipeline" = "filing_corpus_pipeline.__main__:main"


[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "lxml-stubs>=0.5.1",
    "mypy>=1.18.2",
    "pre-commit>=4.6.1",
    "pytest>=9.0.0,<10",
    "pytest-cov>=7.0.0,<8",
    "ruff>=0.16.0,<1",
]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E4",  # pycodestyle import errors
    "E7",  # pycodestyle statement errors
    "E9",  # pycodestyle runtime errors
    "F",   # Pyflakes
    "I",   # import sorting
    "B",   # flake8-bugbear
    "UP",  # modern Python syntax
    "SIM", # code simplification
    "RUF", # Ruff-specific checks
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["filing_corpus_pipeline"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--cov=filing_corpus_pipeline",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=85",
]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = true
